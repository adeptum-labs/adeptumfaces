<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:a="http://adeptumfaces.org/ui">

<h:head>
    <h:title>HELLO WORLD</h:title>
</h:head>

<h:body>

    <h:form>
        <h:commandButton
            value="#{buttonBean.buttonModel.label}"
            action="#{buttonBean.onClick}" />
    </h:form>
        
        <a:commandButton/>

    <h:dataTable value="#{listBean.lists}" var="list" styleClass="table">
        <h:column>
            <f:facet name="header">Id</f:facet>
            #{list.id}
        </h:column>

        <h:column>
            <f:facet name="header">Name</f:facet>
            #{list.name}
        </h:column>
    </h:dataTable>

</h:body>
</html>
