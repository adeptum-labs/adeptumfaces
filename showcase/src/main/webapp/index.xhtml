<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://java.sun.com/jsf/html"
      xmlns:a="http://adeptumfaces.org/ui" xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:fn="http://xmlns.jcp.org/jsp/jstl/functions">

	<h:head>
		<title>HELLO WORLD</title>
	</h:head>
	<h:body>
		<h:outputText value="JSF fungerar!" />

		<h:form>
			<a:button value="Gå till sida 2"
				  outcome="/page2.xhtml" />
		</h:form>


		<h:form>
			<h:panelGroup id="counterPanel" layout="block"
				      style="font-size:24px; margin-bottom:20px;">
				Counter value: #{counterBean.count}
			</h:panelGroup>

			<a:commandbutton value="Increment"
					 ajax="true"
					 action="#{counterBean.increment}"
					 render="counterPanel">
			</a:commandbutton>
		</h:form>

		<h:form>
			<a:commandbutton value="Reset"
					 ajax="true"
					 action="#{counterBean.reset}">
					 value="Uppdatera" action="#{basicView.refreshProducts()}"/>
				<f:ajax/>
			</a:commandbutton>
		</h:form>

                <h:form>
                        <div class="card">
                                <a:datatable id="myTable" value="#{basicView.products}" var="product" rows="5">
                                        <f:facet name="header">
                                                List of Products
                                        </f:facet>

                                        <h:column>
                                                <f:facet name="header">Code</f:facet>
                                                <h:outputText value="#{product.code}" />
                                        </h:column>

                                        <h:column>
                                                <f:facet name="header">Name</f:facet>
                                                <h:outputText value="#{product.name}" />
                                        </h:column>

                                        <h:column>
                                                <f:facet name="header">Category</f:facet>
                                                <h:outputText value="#{product.category}" />
                                        </h:column>

                                        <h:column>
                                                <f:facet name="header">Quantity</f:facet>
                                                <h:outputText value="#{product.quantity}" />
                                        </h:column>

                                        <f:facet name="footer">
                                                <h:outputText value="In total there are #{fn:length(basicView.products)} products." />
                                        </f:facet>
                                </a:datatable>
                        </div>
                </h:form>
	</h:body>
</html>
